name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    # The in-process suite cannot run the Lua scripts or exercise concurrency
    # across clients. These are the guarantees the package exists for, so the
    # Redis tests run here on every Python version.
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PENNYGUARD_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: tests, with a real Redis
        run: python -m pytest -v -rs
      - name: no Redis test may be skipped
        # A typo in the variable name above would turn every Redis test into
        # a skip, and the job would stay green.
        run: |
          set -o pipefail
          python -m pytest tests/test_redis.py -q --no-header -rs | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::Redis tests were skipped"
            exit 1
          fi

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy

  # An editable install resolves package data from the source tree, so only
  # an installed wheel proves py.typed ships and that the core imports with
  # no optional dependency present.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build --wheel --outdir dist/
      - run: python -m venv /tmp/clean
      - run: /tmp/clean/bin/pip install dist/*.whl
      - name: the bare wheel imports and runs without extras
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python - <<'PY'
          import sys
          from importlib import resources

          import pennyguard
          from pennyguard import Budget, MemoryStore, SyncGuard

          assert "redis" not in sys.modules
          assert resources.files("pennyguard").joinpath("py.typed").is_file()
          guard = SyncGuard(MemoryStore(), [Budget("g", 1)])
          guard.reserve("0.5").settle("0.25")
          assert guard.status()[0].spent_usd == 0.25
          print("ok", pennyguard.__version__)
          PY
