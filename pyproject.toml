[build-system]
# 77 is the first setuptools series with PEP 639 license expressions.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pennyguard"
version = "0.4.0"
description = "Hard dollar budgets for LLM calls, enforced atomically across every worker and replica."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Gomes" }]
requires-python = ">=3.11"
keywords = ["llm", "budget", "cost", "spend-limit", "anthropic", "openai", "redis", "rate-limit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
# The core has no dependencies. Redis and OpenTelemetry are opt-in.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "pytest>=8.0",
    "redis>=5.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "ruff>=0.9",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/DevPedroGomes/agent-ops"
Changelog = "https://github.com/DevPedroGomes/agent-ops/blob/main/CHANGELOG.md"
Issues = "https://github.com/DevPedroGomes/agent-ops/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pennyguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TRY", "BLE", "DTZ", "PT"]
ignore = [
    # Settle, release and the event hook catch everything on purpose: once a
    # call is paid for, no backend error may turn the response into a failure.
    "BLE001",
    # Exception messages carry the offending value inline.
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.mypy]
python_version = "3.11"
files = ["src/pennyguard"]
strict = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
